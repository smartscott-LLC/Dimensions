name: Polytope Continuous Integration

on:
  push:
    branches: [main, production, develop]
  pull_request:
    branches: [main, production]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ──────────────────────────────────────────────
  # 1. Lint & Format Check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Python Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Frontend Lint
        working-directory: ./frontend
        run: pnpm run lint

      - name: Python Black Check
        working-directory: ./backend
        run: python -m black --check --line-length 88 lib/ routers/ models/ server.py seed.py

      - name: Python Isort Check
        working-directory: ./backend
        run: python -m isort --check-only lib/ routers/ models/ server.py seed.py

      - name: Python Flake8
        working-directory: ./backend
        run: python -m flake8 --max-line-length 88 lib/ routers/ models/ server.py seed.py

  # ──────────────────────────────────────────────
  # 2. Type Checking
  # ──────────────────────────────────────────────
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Python Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Frontend TypeScript Check
        working-directory: ./frontend
        run: pnpm run typecheck

      - name: Python mypy
        working-directory: ./backend
        run: python -m mypy --ignore-missing-imports lib/ routers/ models/ server.py

      - name: Type Sync Check
        working-directory: ./backend
        run: python scripts/type_sync_check.py

  # ──────────────────────────────────────────────
  # 3. Unit Tests
  # ──────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Set Test Environment
        working-directory: ./backend
        run: |
          cat > .env << 'EOF'
          MONGO_URL=mongodb://localhost:27017
          DB_NAME=test_polytope
          JWT_SECRET=ci-test-jwt-secret-that-is-long-enough-64-chars-minimum
          ADMIN_EMAIL=admin@test.com
          ADMIN_PASSWORD=Test#1234
          SUPABASE_URL=
          SUPABASE_JWKS_URL=
          SUPABASE_SECRET_KEY=
          MODEL_API_KEY=test-key
          MODEL_API_URL=http://localhost:9999
          MODEL_NAME=test-model
          EOF

      - name: Run Unit Tests
        working-directory: ./backend
        run: pytest tests/ -v --tb=short --cov=lib --cov=routers --cov-report=xml

      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./backend/coverage.xml
          fail_ci_if_error: false

  # ──────────────────────────────────────────────
  # 4. Build Checks
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        working-directory: ./frontend
        run: pnpm run build
        env:
          NODE_ENV: production

      - name: Verify Build Output
        run: |
          ls -la frontend/dist/
          test -f frontend/dist/index.html

  # ──────────────────────────────────────────────
  # 5. Docker Build & Push
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/production')
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}-backend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}-frontend
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ──────────────────────────────────────────────
  # 6. Security Scan
  # ──────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          fail-on-error: true

      - name: Check for secrets in code
        run: |
          echo "Checking for hardcoded secrets..."
          grep -r "pk_[0-9a-f]\{40\}" --include="*.py" --include="*.ts" --include="*.tsx" || echo "No hardcoded API keys found"
          grep -r "sk-[a-zA-Z0-9]\{20,\}" --include="*.py" --include="*.ts" --include="*.tsx" || echo "No hardcoded secret keys found"
          grep -r "mongodb://[^$]" --include="*.py" --include="*.ts" --include="*.tsx" || echo "No hardcoded MongoDB URLs found"

  # ──────────────────────────────────────────────
  # 7. Load Test (Lightweight)
  # ──────────────────────────────────────────────
  load-test:
    name: Load Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt

      - name: Run Load Tests
        working-directory: ./backend
        run: pytest tests/test_load.py -v --tb=short

  # ──────────────────────────────────────────────
  # Summary
  # ──────────────────────────────────────────────
  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, docker, security, load-test]
    if: always()
    steps:
      - name: Check status
        run: |
          echo "CI Pipeline Complete"
          echo "Lint: ${{ needs.lint.result }}"
          echo "TypeCheck: ${{ needs.typecheck.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Docker: ${{ needs.docker.result }}"
          echo "Security: ${{ needs.security.result }}"
          echo "LoadTest: ${{ needs.load-test.result }}"
