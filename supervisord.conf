[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10

[program:backend]
command=uvicorn server:app --host 0.0.0.0 --port 8001 --workers 1
directory=/app
autostart=true
autorestart=true
priority=20
