# SnapDeploy Configuration for Polytope Containment Console
# Alternative format if snapdeploy.yml is not supported

name: dimensions
platform: docker

# Build settings
build:
  # Backend service
  backend:
    dockerfile: Dockerfile.backend
    context: .
    target: base
    
  # Frontend service
  frontend:
    dockerfile: Dockerfile.frontend
    context: .
    target: production

# Service definitions
services:
  api:
    image: dimensions-backend
    port: 8001
    environment:
      - MONGO_URL=$MONGO_URL
      - DB_NAME=$DB_NAME
      - JWT_SECRET=$JWT_SECRET
      - ADMIN_EMAIL=$ADMIN_EMAIL
      - ADMIN_PASSWORD=$ADMIN_PASSWORD
      - MODEL_API_KEY=$MODEL_API_KEY
      - MODEL_API_URL=$MODEL_API_URL
      - MODEL_NAME=$MODEL_NAME
      - SUPABASE_URL=$SUPABASE_URL
      - SUPABASE_JWKS_URL=$SUPABASE_JWKS_URL
      - SUPABASE_SECRET_KEY=$SUPABASE_SECRET_KEY
    healthCheck:
      path: /api/health
      port: 8001
      interval: 30s
    restart: always
    
  web:
    image: dimensions-frontend
    port: 3000
    dependsOn:
      - api
    healthCheck:
      path: /
      port: 3000
      interval: 30s
    restart: always

# Domain routing
domains:
  - path: /api
    service: api
  - path: /
    service: web

# Environment secrets (configure in SnapDeploy dashboard)
secrets:
  - MONGO_URL
  - JWT_SECRET
  - ADMIN_PASSWORD
  - MODEL_API_KEY
  - SUPABASE_SECRET_KEY
