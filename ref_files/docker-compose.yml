services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polytope-app
    restart: unless-stopped
    ports:
      - "3000:8081"
    env_file:
      - path: ./backend/.env
    environment:
      - MONGO_URL=${MONGO_URL}
      - DB_NAME=${DB_NAME:-DP3}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@polytope.console}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MODEL_API_KEY=${MODEL_API_KEY}
      - MODEL_API_URL=${MODEL_API_URL}
      - MODEL_NAME=${MODEL_NAME:-agnes-2.5-flash}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWKS_URL=${SUPABASE_JWKS_URL}
      - SUPABASE_SECRET_KEY=${SUPABASE_SECRET_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - polytope-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  polytope-network:
    driver: bridge
