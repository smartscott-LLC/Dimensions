services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: polytope-app
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - polytope-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  polytope-network:
    driver: bridge
